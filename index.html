<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <title>Quicklist</title>

    <link rel="stylesheet" href="styles/index.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,500;1,14..32,500&display=swap" rel="stylesheet">
</head>
<body>
    

    <header>
        <a href="#">
            <img src="assets/arrow.svg" alt="ícone de seta para esquerda">
            Voltar
        </a>
    
        <h1>
            Compras da semana
        </h1>
    </header>

    <main>

        <section id="adicionar">
            <form>
                <input type="text" name="item" id="item" placeholder="Adicione um novo item">
                <button ty>Adicionar novo item</button>
            </form>
        </section>

        <section id="lista">
            <ul>
                <li>
                    <label class="checkbox-container">
                        <input type="checkbox">
                        <span>Suco de laranja</span>
                    </label>

                    <button type="button" aria-label="Remover Bolacha">
                        <img src="assets/trash.svg" alt="">
                    </button>
                </li>

                <li>
                    <label class="checkbox-container">
                        <input type="checkbox">
                        <span>Café preto</span>
                    </label>

                    <button type="button" aria-label="Remover Bolacha">
                        <img src="assets/trash.svg" alt="">
                    </button>
                </li>

                <li>
                    <label class="checkbox-container">
                        <input type="checkbox">
                        <span>Pão de forma</span>
                    </label>

                    <button type="button" aria-label="Remover Bolacha">
                        <img src="assets/trash.svg" alt="">
                    </button>
                </li>

                <li>
                    <label class="checkbox-container">
                        <input type="checkbox">
                        <span>Bolacha</span>
                    </label>

                    <button type="button" aria-label="Remover Bolacha">
                        <img src="assets/trash.svg" alt="">
                    </button>
                </li>
            </ul>
        </section>
    </main>

</body>
</html>
